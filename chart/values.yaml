agent:
  # ---------- AUTH  ----------
  # !!! This helm chart provides two way for passing the personal access token. PLEASE fill only 'pat' or 'patSecret'.
  # 1st way: Personal access token could be passed with 'pat' field.
  pat: ""

  # 2nd way: If a secret that contains personal access token exists in kubernetes, its name and key could be passed with following fields.
  patSecret: ""
  patSecretKey: "pat"
  # ---------- AUTH  ----------

  
  # Server / organization url, e.g.: https://dev.azure.com/your-organization-name
  organizationUrl: ""

  # Agent pool name which the build agent is placed into
  pool: "Default"

  # Working directory of agent
  workingDirectory: "_work"

  # Additional environment variables, if you need
  extraEnv: {}
    # ENVNAME: "VALUE"

nameOverride: ""
fullnameOverride: ""
replicaCount: 1

image:
  # registry: docker.io
  repository: registry.septeo.fr/septeo-ado/azure-agent
  pullPolicy: Always
  tag: "v1.0"
  pullSecrets: []

resources:
  limits:
    cpu: 2
    memory: 5120Mi
  requests:
    cpu: 100m
    memory: 128Mi

volumes: []
  # - name: dockersock
  #   hostPath:
  #     path: /var/run/docker.sock
volumeMounts: []
  # - name: dockersock
  #   mountPath: "/var/run/docker.sock"

buildkit:
  enabled: true
  replicaCount: 3
  resources:
    limits:
      cpu: 2
      memory: 5120Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # Routeur TCP HAProxy (leastconn). Désactivé par défaut.
  # Si enabled: true, les pipelines DOIVENT utiliser tcp://buildkit-lb:6942
  # (et non plus tcp://buildkitd:6942).
  lb:
    enabled: false
    replicaCount: 1
    serverSlots: 10
    image:
      repository: haproxy
      tag: "2.9-alpine"
      pullPolicy: IfNotPresent
      pullSecrets: []
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

serviceAccount:
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
podLabels: {}
podAnnotations: {}
# Defaults are compliant with the "restricted" Pod Security Standard.
# No appArmorProfile: AppArmor is not available on our clusters.
podSecurityContext:
  runAsNonRoot: true
securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
